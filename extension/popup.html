<!doctype html>
<meta charset="utf-8">
<title>Wplace WorldView</title>
<!--
  The popup is NOT a settings panel: the settings live on the map, behind the
  button added to wplace's toolbar. This is where you land when you are after
  help, or after someone to write to — so that is what it is for, and nothing
  else.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --text: #16181d;
    --muted: #5b6270;
    --line: #e3e7ee;
    --hover: #f2f5fa;
    --blue: #1c61e7;
  }
  /* The theme follows the system. The data-theme attribute exists only so the
     preview can force one or the other: an @media rule cannot be driven
     from the page. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d; --text: #e7eaf0; --muted: #9aa2b1;
      --line: #262a33; --hover: #1e222a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181d; --text: #e7eaf0; --muted: #9aa2b1;
    --line: #262a33; --hover: #1e222a;
  }
  * { box-sizing: border-box }
  body {
    width: 300px; margin: 0; padding: 18px 18px 14px;
    background: var(--bg); color: var(--text);
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .tete { display: flex; align-items: center; gap: 11px }
  .tete svg { width: 42px; height: 42px; flex: none }
  h1 { margin: 0; font-size: 14px; letter-spacing: .2px }
  .version { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums }
  .quoi { margin: 13px 0 0; color: var(--muted); font-size: 12px }
  .ou {
    margin: 12px 0 0; padding: 9px 11px 10px; border-radius: 9px;
    background: var(--hover); color: var(--muted); font-size: 12px;
  }
  /* The button that lights the bubble back up on the map. Full width: it is
     the only action on this page, everything else is nothing but links. */
  .montre {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; margin-top: 9px; padding: 8px 10px;
    border: 0; border-radius: 7px; cursor: pointer;
    background: var(--blue); color: #fff;
    font: 600 12.5px/1.2 inherit;
  }
  .montre:hover { filter: brightness(1.08) }
  .montre:active { transform: translateY(1px) }
  .montre:disabled { opacity: .6; cursor: default; transform: none; filter: none }
  .montre svg { width: 15px; height: 15px; flex: none }
  .liens { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px }
  a {
    display: flex; align-items: center; gap: 9px;
    margin: 0 -8px; padding: 8px; border-radius: 8px;
    color: inherit; text-decoration: none; font-size: 12.5px;
  }
  a:hover { background: var(--hover) }
  a svg { width: 16px; height: 16px; flex: none; color: var(--muted) }
  a .detail { margin-left: auto; color: var(--muted); font-size: 11px }
  footer { margin-top: 10px; color: var(--muted); font-size: 11px; text-align: center }
</style>

       button, in ocean blue and continent green, lifted from their own logo. -->
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g transform="translate(6,6) scale(0.0917) translate(0,960)">
      <circle cx="480" cy="-480" r="444" fill="#000000"/>
      <circle cx="480" cy="-480" r="400" fill="#4AD95B"/>

    </g>
  </svg>
  <div>
    <h1 id="nom">Wplace WorldView</h1>
    <div class="version" id="version"></div>
  </div>
</div>
